version: "3.8"

services:
  mboa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mboflow-agent
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - SIMULATION_MODE=false
      - MBOA_SECRET_KEY=change_this_to_a_secure_random_production_secret_key_32chars_min
      - MBOA_DATA_DIR=/app/data
      # - MTN_MOMO_SUBSCRIPTION_KEY=
      # - MTN_MOMO_API_USER=
      # - MTN_MOMO_API_KEY=
      # - ORANGE_MONEY_CLIENT_ID=
      # - ORANGE_MONEY_CLIENT_SECRET=
      # - ORANGE_MONEY_MERCHANT_KEY=
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - mboflow_data:/app/data

volumes:
  mboflow_data:
    driver: local
